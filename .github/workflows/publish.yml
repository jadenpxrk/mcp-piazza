name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
      - name: Tag matches version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import mcp_piazza; print(mcp_piazza.__version__)')"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP registry GitHub OIDC login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wait for PyPI
        run: |
          for i in $(seq 1 12); do
            curl -fsS "https://pypi.org/pypi/mcp-piazza/${GITHUB_REF_NAME#v}/json" >/dev/null && exit 0
            sleep 30
          done
          exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish

  mcpb:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the bundle to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . mcp-piazza.mcpb
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mcp-piazza.mcpb --generate-notes
