name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest
      - name: Versions match
        run: |
          v=$(uv run python -c "import mcp_piazza; print(mcp_piazza.__version__)")
          test "$(jq -r .version manifest.json)" = "$v"
          test "$(jq -r .version server.json)" = "$v"
          test "$(jq -r '.packages[0].version' server.json)" = "$v"
